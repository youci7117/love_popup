<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Popup</title>

<style>
    body {
        margin: 0;
        font-family: "Comic Sans MS", "Microsoft JhengHei", sans-serif;
        background-color: #ffe6f2;
        overflow: hidden;
    }

    /* --- 进入画面 --- */
    #startScreen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #ffb6c1, #ffcbe6);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
    }

    #startScreen h1 {
        font-size: 32px;
        color: white;
        margin-bottom: 20px;
    }

    #startBtn {
        padding: 12px 30px;
        font-size: 20px;
        background: white;
        color: #ff5fa2;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0px 4px 10px rgba(255, 105, 180, 0.5);
        transition: 0.3s;
    }
    #startBtn:hover {
        transform: scale(1.05);
    }

    /* --- 主内容区 --- */
    #mainContent {
        opacity: 0;
        transition: opacity 1.2s ease;
    }

    /* --- 小句子弹窗（自动跳出） --- */
    #miniPopup {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #ffdaf0;
        padding: 15px 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        font-size: 16px;
        display: none;
        animation: miniFade 0.8s;
        z-index: 998;
    }

    @keyframes miniFade {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- 主弹窗 --- */
    #lovePopup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px;
        width: 280px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(255, 105, 180, 0.4);
        display: none;
        z-index: 999;
        animation: fadeIn 0.8s;
    }

    #lovePopup img {
        width: 150px;
        margin-bottom: 15px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translate(-50%, -60%); }
        to { opacity: 1; transform: translate(-50%, -50%); }
    }

    #lovePopup button {
        margin-top: 15px;
        padding: 10px 20px;
        background: #ff88bb;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }
</style>
</head>

<body>

<!-- 进入画面 -->
<div id="startScreen">
    <h1>💕 给你的小惊喜 💕</h1>
    <button id="startBtn">进入</button>
</div>

<!-- 主画面 -->
<div id="mainContent">

    <!-- 小句子弹窗 -->
    <div id="miniPopup">
        💬 想偷偷告诉你一件事...
    </div>

    <!-- 主恋爱弹窗（含图片） -->
    <div id="lovePopup">
        <img src="cute.png" alt="">
        <h2>我想跟你说：</h2>
        <p>你是我每天最最最期待的人 💗</p>
        <button onclick="closeLovePopup()">好啦~</button>
    </div>

</div>

<!-- 背景音乐 -->
<audio id="bgm" src="music.mp3"></audio>

<script>
// 点击进入按钮
document.getElementById("startBtn").onclick = function () {

    // 隐藏进入画面
    document.getElementById("startScreen").style.display = "none";

    // 主内容淡入
    document.getElementById("mainContent").style.opacity = 1;

    // 背景音乐淡入播放
    let bgm = document.getElementById("bgm");
    let volume = 0;

    bgm.volume = 0;
    bgm.play();

    let fadeIn = setInterval(() => {
        if (volume < 0.5) {
            volume += 0.02;
            bgm.volume = volume;
        } else {
            clearInterval(fadeIn);
        }
    }, 150);

    // 小句子弹窗（先出现）
    setTimeout(() => {
        document.getElementById("miniPopup").style.display = "block";
    }, 600);

    // 主弹窗（再出现）
    setTimeout(() => {
        document.getElementById("lovePopup").style.display = "block";
    }, 1500);
};

function closeLovePopup() {
    document.getElementById("lovePopup").style.display = "none";
}
</script>

</body>
</html>
