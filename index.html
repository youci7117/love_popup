<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Popup</title>

    <style>
        /* 全局設定 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffe6f2;
            font-family: "Comic Sans MS", "Microsoft JhengHei", sans-serif;
            user-select: none;
            position: relative; /* 為了讓 ::before 心跳光暈定位 */
        }

        /* ★ 新增：背景心跳光暈（在所有內容後面跳動的粉光） */
        body::before {
            content: "";
            position: fixed;
            inset: -40px; /* 稍微超出畫面，避免邊緣硬線 */
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 160, 200, 0.55),
                    rgba(255, 230, 242, 0) 60%
                );
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: pulseHeart 3s ease-in-out infinite;
            transform-origin: center center;
        }

        /* 進入畫面 */
        #enterScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #ff9acb, #ffb7dd);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
            animation: fadeIn 1s ease forwards;
        }

        #enterScreen h1 {
            font-size: 32px;
            color: white;
            margin-bottom: 16px;
            text-shadow: 0 4px 10px rgba(255, 255, 255, 0.6);
        }

        /* 名字輸入框 */
        #nameInput {
            padding: 10px 14px;
            font-size: 18px;
            border-radius: 20px;
            border: none;
            outline: none;
            margin-bottom: 14px;
            text-align: center;
            width: 230px;
            box-shadow: 0 3px 8px rgba(255, 105, 180, 0.45);
        }

        #enterBtn {
            padding: 12px 30px;
            font-size: 20px;
            background: white;
            color: #ff5fa2;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.5);
            transition: 0.3s;
        }

        #enterBtn:hover {
            transform: scale(1.05);
        }

        /* 主區域容器 */
        #mainArea {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            z-index: 1; /* 壓在心跳光暈上面 */
        }

        /* 彈窗容器 */
        #popupContainer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        /* 彈窗基礎樣式 */
        .popupBox {
            position: absolute;
            background: white;
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.35);
            opacity: 0;
            pointer-events: none;
        }

        /* 帶飄浮效果的彈窗 */
        .popupBox.floatBubble {
            animation:
                fadeIn 0.6s ease forwards,
                floatDown var(--float-duration, 7s) ease-in-out infinite alternate;
        }

        /* 圖片彈窗 */
        .popupImg {
            width: 240px;
            border-radius: 12px;
            display: block;
        }

        /* 文字彈窗 */
        .popupText {
            font-size: 20px;
            color: #ff4f8b;
            padding: 5px;
            max-width: 260px;
            text-align: center;
        }

        /* 小愛心 */
        .heart {
            position: fixed;
            font-size: 24px;
            color: #ff4f8b;
            pointer-events: none;
            animation: heartFloat 0.9s ease-out forwards;
        }

        /* 淡入效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 泡泡微微上下飄、帶一點水平偏移 */
        @keyframes floatDown {
            from {
                transform: translateY(0px) translateX(0px);
            }
            to {
                transform: translateY(30px) translateX(10px);
            }
        }

        /* ★ 新增：心跳光暈脈動動畫 */
        @keyframes pulseHeart {
            0% {
                opacity: 0.25;
                transform: scale(1);
            }
            35% {
                opacity: 0.55;
                transform: scale(1.04);
            }
            60% {
                opacity: 0.3;
                transform: scale(1.01);
            }
            100% {
                opacity: 0.25;
                transform: scale(1);
            }
        }

        /* 舊彈窗淡出壓底（堆疊感 + 漸淡） */
        .fadeOutLayer {
             opacity: 0.4 !important;
             z-index: 1 !important;
             transition: opacity 1.2s ease;
        }

        /* 愛心往上飄 */
        @keyframes heartFloat {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-60px);
                opacity: 0;
            }
        }

        /* 最後告白畫面 */
        #finalScreen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            animation: fadeIn 0.8s ease forwards;
        }

        .finalBox {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        .finalImg {
            width: min(80vw, 360px);
            border-radius: 16px;
            display: block;
            margin: 0 auto 15px;
        }

        .finalText {
            font-size: 22px;
            color: #ff4f8b;
            margin-top: 10px;
            white-space: pre-line;  /* 支援換行 \n */
        }
    </style>
</head>

<body>

    <!-- 進入畫面 -->
    <div id="enterScreen">
        <h1>💕 給你的小驚喜 💕</h1>
        <input id="nameInput" type="text" placeholder="要給誰的小驚喜？" />
        <button id="enterBtn">進入</button>
    </div>

    <!-- 主區域 -->
    <div id="mainArea">
        <div id="popupContainer"></div>
    </div>

    <!-- 背景音樂（檔名自己改） -->
    <audio id="bgm" src="hvpbo-khuht.mp3" preload="auto"></audio>

    <script>
        // ░░░ 你的 28 張圖片（依你的檔名修改） ░░░
        const imageList = [
            "20251015181155.png","2025102419201.png","202510319582.png","2025105231052.png",
            "202511115542.png","2025111216234.png","2025111323412.png","2025712223424.png",
            "2025712225433.png","2025712225934.png","2025716145.png","202573014642.png",
            "202574123.png","20257513233.png","2025770216.png","20258103110.png",
            "202581123535.png","202581811226.png","202581812236.png","20258181841.png",
            "20258280282.png","2025891106.png","2025891567.png","202591303746.png",
            "2025928211642.png","2025928231020.png","202596195817.png","202596211548.png"
        ];

        // ░░░ 告白文字（用 {name} 當佔位符） ░░░
        const textList = [
            "今天也要開心，{name}！",
            "{name}高不高級呀！",
            "{name}是最厲害的！",
            "{name}萌萌",
            "我親親{name}",
            "我是{name}的小狗！",
            "老公！",
            "我喜歡你，{name}！",
            "萌鼠了",
            "看到{name}就會笑"
        ];

        // ░░░ 最後一張大圖＆最後一段話 ░░░
        const finalImage = "final_big.png";   // 換成你的「最後大圖」檔名
        const finalMessage = "從今天開始，\n我想要一直待在你身邊。\n\n可以把未來的一部分，分給我嗎？";

        const popupContainer = document.getElementById("popupContainer");
        const enterScreen = document.getElementById("enterScreen");
        const enterBtn = document.getElementById("enterBtn");
        const bgm = document.getElementById("bgm");
        const nameInput = document.getElementById("nameInput");

        let popupHistory = [];     // 記錄上一輪的彈窗
        let popupRunning = false;  // 控制彈窗循環
        let clickCount = 0;        // 點擊次數
        let finalShown = false;    // 最後畫面是否已經出現
        let targetName = "你";     // 目標名字，預設「你」

        // ░░░ 點「進入」後 ░░░
        enterBtn.onclick = function () {
            // 抓取她輸入的名字
            const v = nameInput.value.trim();
            targetName = v || "你";

            // 關閉封面
            enterScreen.style.display = "none";

            // 播放 BGM（漸漸變大聲）
            bgm.volume = 0;
            bgm.play().catch(() => {});

            let vol = 0;
            let fade = setInterval(() => {
                if (vol < 0.5) {
                    vol += 0.02;
                    bgm.volume = vol;
                } else {
                    clearInterval(fade);
                }
            }, 120);

            // 啟動彈窗循環
            startPopupLoop();
        };

        // ░░░ 主循環：每一輪隨機彈出 2–4 個 ░░░
        function startPopupLoop() {
            popupRunning = true;

            function launchRound() {
                if (!popupRunning) return;  // 若已經結束，就不要繼續跑

                // 先處理舊的一輪
                const oldPopups = popupHistory;
                oldPopups.forEach(box => {
                    // 2 秒後才開始變淡，讓圖片有時間看清楚
                    setTimeout(() => {
                        box.classList.add("fadeOutLayer");
                    }, 2000);

                    // 8 秒後移除舊彈窗，避免越堆越多
                    setTimeout(() => {
                        if (box.parentNode) box.remove();
                    }, 8000);
                });

                // 這一輪的新彈窗
                let count = Math.floor(Math.random() * 3) + 2; // 2~4 個
                let newRound = [];

                for (let i = 0; i < count; i++) {
                    let isImage = Math.random() < 0.7; // 70% 圖片、30% 文字
                    let box = document.createElement("div");
                    // 加上 floatBubble，讓它有飄浮動畫
                    box.className = "popupBox floatBubble";

                    // 隨機給每個框一個飄浮時間（6~10 秒）
                    let floatDuration = Math.random() * 4 + 6; // 6~10
                    box.style.setProperty("--float-duration", floatDuration + "s");

                    // 圖片尺寸（180 ~ 260）
                    let size = Math.random() * 80 + 180;

                    if (isImage) {
                        let img = document.createElement("img");
                        img.src = imageList[Math.floor(Math.random() * imageList.length)];
                        img.className = "popupImg";
                        img.style.width = size + "px";
                        box.appendChild(img);
                    } else {
                        let txt = document.createElement("div");
                        txt.className = "popupText";

                        // 帶入名字
                        let raw = textList[Math.floor(Math.random() * textList.length)];
                        let msg = raw.replaceAll("{name}", targetName);
                        txt.innerText = msg;

                        box.appendChild(txt);
                    }

                    // 隨機位置（大概避免出界）
                    let maxX = window.innerWidth - 260;
                    let maxY = window.innerHeight - 260;
                    let x = Math.random() * maxX;
                    let y = Math.random() * maxY;

                    box.style.left = x + "px";
                    box.style.top = y + "px";
                    box.style.zIndex = 1500;

                    popupContainer.appendChild(box);
                    newRound.push(box);
                }

                popupHistory = newRound;

                // 下一輪：3 ~ 5 秒後（節奏較慢）
                let delay = Math.random() * 2000 + 3000;
                setTimeout(launchRound, delay);
            }

            // 1 秒後開第一輪
            setTimeout(launchRound, 1000);
        }

        // ░░░ 顯示最後大圖＋文字（結束畫面） ░░░
        function showFinal() {
            if (finalShown) return;
            finalShown = true;
            popupRunning = false;  // 停止之後的彈窗循環

            const overlay = document.createElement("div");
            overlay.id = "finalScreen";

            const box = document.createElement("div");
            box.className = "finalBox";

            const img = document.createElement("img");
            img.src = finalImage;
            img.className = "finalImg";

            const text = document.createElement("div");
            text.className = "finalText";
            text.innerText = finalMessage;

            box.appendChild(img);
            box.appendChild(text);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }

        // ░░░ 點擊畫面時：愛心 + 統計點擊次數 ░░░
        document.addEventListener("click", function (e) {
            // 封面還沒關掉時，不要出愛心 / 不計次
            if (enterScreen.style.display !== "none") return;

            // 點擊計數：第五下觸發結局
            if (!finalShown) {
                clickCount++;
                if (clickCount >= 5) {
                    showFinal();
                }
            }

            // 冒出小愛心
            let heart = document.createElement("div");
            heart.className = "heart";
            heart.innerText = "❤";

            heart.style.left = e.clientX + "px";
            heart.style.top = e.clientY + "px";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 900);
        });
    </script>
</body>
</html>
