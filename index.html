<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Popup</title>

<style>
    body {
        margin: 0;
        font-family: "Comic Sans MS", "Microsoft JhengHei", sans-serif;
        background-color: #ffe6f2;
        overflow: hidden;
    }

    /* --- 进入画面 --- */
    #startScreen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #ffb6c1, #ffcbe6);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
    }

    #startScreen h1 {
        font-size: 32px;
        color: white;
        margin-bottom: 20px;
    }

    #startBtn {
        padding: 12px 30px;
        font-size: 20px;
        background: white;
        color: #ff5fa2;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0px 4px 10px rgba(255, 105, 180, 0.5);
        transition: 0.3s;
    }
    #startBtn:hover { transform: scale(1.05); }

    /* --- 主内容区 --- */
    #mainContent {
        opacity: 0;
        transition: opacity 1.2s ease;
    }

    /* --- 小句子弹窗 --- */
    #miniPopup {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #ffdaf0;
        padding: 15px 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        font-size: 16px;
        display: none;
        animation: miniFade 0.8s;
        z-index: 998;
    }

    @keyframes miniFade {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- 主弹窗固定样式 --- */
    .popupBox {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        padding: 25px;
        background: white;
        border-radius: 20px;
        text-align: center;
        display: none;
        z-index: 999;
        box-shadow: 0 5px 25px rgba(255, 105, 180, 0.35);
        animation: fadeIn 0.8s;
    }

    .popupBox img {
        width: 150px;
        margin-bottom: 15px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translate(-50%, -60%); }
        to { opacity: 1; transform: translate(-50%, -50%); }
    }
</style>
</head>

<body>

<!-- 进入画面 -->
<div id="startScreen">
    <h1>💕 给你的小惊喜 💕</h1>
    <button id="startBtn">进入</button>
</div>

<!-- 主画面 -->
<div id="mainContent">

    <!-- 小句子弹窗 -->
    <div id="miniPopup">💬 想偷偷告诉你一件事...</div>

    <!-- 主告白弹窗 -->
    <div id="popup1" class="popupBox">
        <img src="2025102419201.png" alt="">
        <h2>我想跟你说：</h2>
        <p>你是我每天最最最期待的人 💗</p>
    </div>

    <!-- D 模式：文字弹窗 -->
    <div id="popup2" class="popupBox">
        <p>其实啊，每次看到你我都会超级开心 ✨</p>
    </div>

    <!-- E 模式：图片弹窗 -->
    <div id="popup3" class="popupBox">
        <img src="20251015181155.png">
        <p>送你小花花 🌸</p>
    </div>

</div>

<!-- 背景音乐 -->
<audio id="bgm" src="music.mp3"></audio>

<script>
document.getElementById("startBtn").onclick = function () {

    // 关闭进入画面
    document.getElementById("startScreen").style.display = "none";

    // 主画面淡入
    document.getElementById("mainContent").style.opacity = 1;

    // 背景音乐淡入
    let bgm = document.getElementById("bgm");
    let volume = 0;
    bgm.volume = 0;
    bgm.play();

    let fadeIn = setInterval(() => {
        if (volume < 0.5) {
            volume += 0.02;
            bgm.volume = volume;
        } else {
            clearInterval(fadeIn);
        }
    }, 150);

    // 小句子弹窗最先出现
    setTimeout(() => {
        document.getElementById("miniPopup").style.display = "block";
    }, 600);

    // 让 miniPopup 自动消失
    setTimeout(() => {
        document.getElementById("miniPopup").style.display = "none";
    }, 2000);

    // 🚀 弹窗轮播系统
    let popups = ["popup1", "popup2", "popup3"];  
    let index = 0;

    function showNextPopup() {
        if (index >= popups.length) return;

        let id = popups[index];
        let popup = document.getElementById(id);

        // 显示
        popup.style.display = "block";

        // 2.5 秒后自动关闭
        setTimeout(() => {
            popup.style.display = "none";
            index++;
            showNextPopup();  // 继续播放下一个
        }, 2500);
    }

    // 主弹窗轮播在 1.6 秒后开始
    setTimeout(showNextPopup, 1600);

};
</script>

</body>
</html>
